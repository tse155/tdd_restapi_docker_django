name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push image
      - env:
          # Disables advanced BuildKit features that create unsupported OCI formats
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          docker pull $IMAGE:latest || true

          # Force the standard single-architecture linux/amd64 build
          docker build \
            --platform linux/amd64 \
            --cache-from $IMAGE:latest \
            --tag $IMAGE:latest \
            --file ./backend/Dockerfile.prod \
            ./backend
          docker push $IMAGE:latest

  test:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: users
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runner
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    container:
      image: ghcr.io/${{ github.repository }}:latest
      options: --user root 
    env:
      DATABASE_URL: postgresql://runner:runner@postgres:5432/users
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          cd backend
          pytest -p no:warnings --cov=.
          flake8 .
          black --check --exclude=migrations .
          isort . --check-only

          
  audit:
    runs-on: ubuntu-latest
    needs: build
    container:
      image: ghcr.io/${{ github.repository }}:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Audit dependencies
        run: |
          cd backend
          pip-audit -r requirements.txt
  
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      HEROKU_APP_NAME: shrouded-coast-71667
      HEROKU_REGISTRY_IMAGE: registry.heroku.com/shrouded-coast-71667/web
      HEROKU_AUTH_TOKEN: ${{ secrets.HEROKU_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Heroku registry
        run: echo "$HEROKU_AUTH_TOKEN" | docker login registry.heroku.com -u _ --password-stdin
      - name: Build and push
        run: |
          docker build \
            --tag $HEROKU_REGISTRY_IMAGE \
            --file ./backend/Dockerfile.prod \
            ./backend
          docker push $HEROKU_REGISTRY_IMAGE
      - name: Release
        run: |
          chmod +x ./release.sh
          ./release.sh  